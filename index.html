<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幹部進階班">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F1F8F4">
<title>雪坊幹部學堂 進階班</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

/* Layout: same shell as 雪坊幹部學堂 — header, hero with 5 steps, one slide card with prev/next, bottom tab bar. 衛管 green. */
:root{
  --bg:#F1F8F4; --surface:#FFFFFF; --ink:#17212B; --muted:#5E6A75; --line:#DCE2E8;
  --accent:#1E8A5A; --accent-soft:#DDF3E8; --accent-deep:#146343; --on-accent:#FFFFFF;
  --ok:#2E8A57; --ok-soft:#E0F3E8; --warn:#A35F00; --warn-soft:#FDF0DA; --bad:#B3261E; --bad-soft:#FBE5E3;
  --gold:#B8860B; --gold-soft:#FFF4CC; --lock:#C9D1D8;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#18202A; --ink:#E7ECF1; --muted:#9BA7B3; --line:#2B3541;
  --accent:#4CC28A; --accent-soft:#163323; --accent-deep:#7FD4A3; --on-accent:#0B1A12;
  --ok:#7FD4A3; --ok-soft:#163323; --warn:#F2B35B; --warn-soft:#3A2A10; --bad:#F2867E; --bad-soft:#3A1A18;
  --gold:#E8C45A; --gold-soft:#3A3010; --lock:#3A4552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#18202A; --ink:#E7ECF1; --muted:#9BA7B3; --line:#2B3541;
  --accent:#4CC28A; --accent-soft:#163323; --accent-deep:#7FD4A3; --on-accent:#0B1A12;
  --ok:#7FD4A3; --ok-soft:#163323; --warn:#F2B35B; --warn-soft:#3A2A10; --bad:#F2867E; --bad-soft:#3A1A18;
  --gold:#E8C45A; --gold-soft:#3A3010; --lock:#3A4552; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 100px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top h1{font:700 1.35rem var(--f-display);color:var(--accent-deep);margin:0}
.tagx{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.hero{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.hero .meta{display:flex;justify-content:space-between;font-size:.8rem;letter-spacing:.06em;opacity:.92;gap:8px;flex-wrap:wrap}
.hero .tt{font:700 1.2rem/1.4 var(--f-display);text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.steps button{display:grid;justify-items:center;gap:2px;background:none;border:0;color:inherit;font:500 .72rem var(--f-body);cursor:pointer;padding:2px;opacity:.85}
.steps button i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem}
.steps button.done i{background:rgba(255,255,255,.3);border-color:transparent}
.steps button.cur{opacity:1;font-weight:700}
.steps button.cur i{background:var(--surface);color:var(--accent-deep);border-color:var(--surface)}
.steps button:focus-visible{outline:2px solid var(--on-accent);border-radius:8px}
.trail{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem}
.trail span{background:rgba(255,255,255,.2);border-radius:999px;padding:1px 10px}
.resume{font-size:.82rem;background:var(--accent-soft);color:var(--accent-deep);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
.card h2{font:700 1.2rem/1.45 var(--f-display);margin:0;text-wrap:balance}
.card h3{font:700 1rem/1.5 var(--f-body);margin:0}
.card p{margin:0}
.goal{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.goal b{color:var(--accent-deep);white-space:nowrap;font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:1px 10px;justify-self:start}
.tag.two{color:var(--warn);background:var(--warn-soft)}
ol.pts,ul.pts{margin:0;padding-left:1.3em;display:grid;gap:6px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top;white-space:pre-line}
th{color:var(--muted);font-weight:500;border-top:0}
.small{font-size:.8rem;color:var(--muted)}
.story{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.story b{color:var(--accent-deep)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;min-width:0}
.fact strong{display:block;font:700 1.1rem var(--f-display);font-variant-numeric:tabular-nums}
.fact span{font-size:.72rem;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt b{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--accent-soft);color:var(--accent-deep)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.55}
.why{border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:.93rem}
.why.good{background:var(--ok-soft)} .why.mid{background:var(--warn-soft)} .why.bad{background:var(--bad-soft)} .why.info{background:var(--accent-soft)}
.why .lbl{font-weight:700;font-size:.85rem}
.why.good .lbl{color:var(--ok)} .why.mid .lbl{color:var(--warn)} .why.bad .lbl{color:var(--bad)} .why.info .lbl{color:var(--accent-deep)}
.take{border-left:4px solid var(--accent);padding:4px 0 4px 12px;font:700 1.02rem/1.6 var(--f-display)}
.back{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.back b{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.ord{display:grid;gap:6px}
.ord button{text-align:left;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px}
.ord button i{font-style:normal;flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-size:.78rem;background:var(--bg);color:var(--muted)}
.ord button.on i{background:var(--accent);color:var(--on-accent)}
.ord button[disabled]{cursor:default}
textarea{width:100%;box-sizing:border-box;min-height:84px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent)}
.btn{font:500 .92rem var(--f-body);border-radius:999px;padding:8px 16px;cursor:pointer;border:1.5px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent-deep)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.end{display:grid;gap:10px;justify-items:center;text-align:center}
.end .no{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.end h3{font:700 1.4rem var(--f-display);margin:0}
.end svg{width:120px;height:auto}
.endset{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.endset div{border:1px dashed var(--line);border-radius:10px;padding:6px 4px;font-size:.72rem;color:var(--muted);text-align:center}
.endset div.on{border-style:solid;border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
.cel{display:grid;justify-items:center;gap:6px;text-align:center}
.cel svg{width:120px;height:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.stat b{display:block;font:700 1.3rem var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wall .c{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0;align-content:start}
.wall svg{width:100%;max-width:76px;height:auto}
.wall span{font-size:.7rem;color:var(--muted);line-height:1.3}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.a{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;min-width:0}
.a .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 1.1rem var(--f-display);background:var(--bg);color:var(--muted);border:1.5px dashed var(--lock)}
.a.on .ic{background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.a b{display:block;font-size:.88rem}
.a span{display:block;font-size:.74rem;color:var(--muted);line-height:1.35}
.note{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:2px}
.note b{font-size:.85rem}
.note p{white-space:pre-wrap;font-size:.92rem}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.pseg button{font:500 .92rem var(--f-body);border:0;border-radius:999px;padding:7px 0;background:transparent;color:var(--muted);cursor:pointer}
.pseg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.pseg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:4;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:500 .76rem var(--f-body);padding:6px 2px;border-radius:12px;cursor:pointer;display:grid;justify-items:center;gap:1px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.achpop[hidden]{display:none}
.achpop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,16,20,.45);padding:24px max(16px,env(safe-area-inset-left,0px))}
.achpop .box{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 20px 18px;width:min(340px,100%);display:grid;gap:10px;justify-items:center;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);position:relative;overflow:hidden}
.achpop .star{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:700 2.4rem var(--f-display);color:#6A4A00;background:radial-gradient(circle at 35% 30%,#FFF0B3,#C8961A);border:3px solid #94690A}
.achpop .lab{font-size:.78rem;letter-spacing:.12em;color:var(--gold)}
.achpop h3{font:700 1.35rem var(--f-display);margin:0}
.achpop p{margin:0;color:var(--muted);font-size:.92rem}
.achpop .more{font-size:.78rem;color:var(--muted)}
.achpop .conf{position:absolute;inset:0;pointer-events:none}
.achpop .conf i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .achpop .box{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both} @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  .achpop .star{animation:spin 1s ease-out both} @keyframes spin{from{transform:rotateY(180deg) scale(.6)}to{transform:none}}
  .achpop .conf i{animation:fall 1.6s ease-in forwards} @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(320px) rotate(300deg)}}
}
.toast[hidden]{display:none}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 16px;display:flex;gap:10px;align-items:center;width:min(340px,calc(100% - 32px));box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5}
.toast .ic{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold);display:grid;place-items:center;font:700 1rem var(--f-display);flex:none}
.toast small{display:block;opacity:.75;font-size:.75rem}
@media (prefers-reduced-motion:no-preference){
  .in{animation:in .3s ease both} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .drop{animation:dr .9s cubic-bezier(.2,1.4,.4,1) both} @keyframes dr{0%{transform:translateY(-40px) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
  .glint{animation:gl 4.5s ease-in-out infinite} @keyframes gl{0%,72%{transform:translateX(-60px);opacity:0}78%{opacity:.75}92%{transform:translateX(60px);opacity:0}100%{opacity:0}}
  .toast{animation:tin .4s ease both} @keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
}


/* 職務配色：衛管綠（預設）、生管藍、生產主管橘 */
body[data-role="prod"]{--accent:#3B5BDB;--accent-soft:#E7ECFF;--accent-deep:#2B44A8;--bg:#F3F5FE}
body[data-role="line"]{--accent:#C2551F;--accent-soft:#FDE9DE;--accent-deep:#9A3E12;--bg:#FCF5F1}
@media (prefers-color-scheme: dark){
  body[data-role="prod"]{--accent:#8EA6FF;--accent-soft:#1C2445;--accent-deep:#B9C8FF;--bg:#11141F;--on-accent:#0B1020}
  body[data-role="line"]{--accent:#F0A070;--accent-soft:#3A2214;--accent-deep:#F7C3A2;--bg:#18120F;--on-accent:#1A0E06}}
:root[data-theme="dark"] body[data-role="prod"]{--accent:#8EA6FF;--accent-soft:#1C2445;--accent-deep:#B9C8FF;--bg:#11141F;--on-accent:#0B1020}
:root[data-theme="dark"] body[data-role="line"]{--accent:#F0A070;--accent-soft:#3A2214;--accent-deep:#F7C3A2;--bg:#18120F;--on-accent:#1A0E06}
:root[data-theme="light"] body[data-role="prod"]{--accent:#3B5BDB;--accent-soft:#E7ECFF;--accent-deep:#2B44A8;--bg:#F3F5FE;--on-accent:#FFFFFF}
:root[data-theme="light"] body[data-role="line"]{--accent:#C2551F;--accent-soft:#FDE9DE;--accent-deep:#9A3E12;--bg:#FCF5F1;--on-accent:#FFFFFF}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.roles button{font:500 .92rem var(--f-body);border:0;border-radius:999px;padding:7px 0;background:transparent;color:var(--muted);cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.roles button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.soon{display:grid;gap:10px}
.soon ol{margin:0;padding-left:1.4em;display:grid;gap:2px;font-size:.92rem}
.cat{display:grid;gap:6px}
.cat details{border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.cat summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;cursor:pointer;list-style:none}
.cat summary::-webkit-details-marker{display:none}
.cat .wk{font:600 .78rem ui-monospace,Menlo,monospace;color:var(--accent-deep)}
.cat .nm b{display:block;font-size:.92rem}
.cat .nm small{font-size:.74rem;color:var(--muted)}
.cat .stt{font-size:.75rem;color:var(--muted);white-space:nowrap}
.cat ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.cat li button{width:100%;text-align:left;font:inherit;font-size:.88rem;background:none;border:0;color:var(--ink);display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.cat li button[disabled]{color:var(--muted);cursor:default}
.cat .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.7rem;flex:none}
.cat .ck.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ring{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ring svg{width:72px;height:72px;display:block}
.ring .rt{display:grid;gap:2px;min-width:0}
.ring b{font-size:1.02rem}
.ring span{font-size:.8rem;color:var(--muted);line-height:1.45}
.kseg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.kseg button{flex:1 1 auto;min-width:0;font:500 .92rem var(--f-body);border:0;border-radius:999px;padding:7px 6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.kseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.kseg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ksub{margin:-6px 0 0;font-size:.85rem;color:var(--muted)}
.plan{display:grid;gap:6px}
.plan div{border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.plan span{color:var(--muted);font-size:.78rem;white-space:nowrap}

/* 完整版新增：名詞、開場、案例輪次、備份、預告 */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dashed var(--accent);cursor:pointer;line-height:inherit}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sheet[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.sheet .in2{max-width:560px;margin:0 auto;width:100%;display:grid;gap:8px}
.sheet b{font:700 1.1rem var(--f-display);color:var(--accent-deep)}
.sheet p{margin:0}
.sheet .btn{justify-self:start}
.rbadge{display:inline-flex;gap:6px;align-items:center;font-size:.75rem;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--muted);justify-self:start}
.rbadge.me{background:var(--accent);color:var(--on-accent)}
.teaser{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:10px 14px;font-size:.88rem}
.teaser b{color:var(--accent-deep)}
.onb{display:grid;gap:14px}
.onb .big{font:700 1.4rem/1.4 var(--f-display);margin:0;text-wrap:balance}
.onb ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.onb .pick{display:grid;gap:8px}
.onb .pick button{font:500 1rem var(--f-body);text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer}
.onb .pick button:hover{border-color:var(--accent)}
.onb .pick button small{display:block;color:var(--muted);font-size:.8rem}
.bk{display:grid;gap:8px}
.bk code{display:block;max-height:4.8em;overflow:auto;word-break:break-all;font:500 .72rem ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.bk input{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.lawcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.lawcard h3{font:700 1rem var(--f-body);margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lawcard h3 span{font-size:.75rem;color:var(--muted);font-weight:500}
.lawcard details{border-top:1px solid var(--line);padding-top:6px}
.lawcard summary{cursor:pointer;font-size:.85rem;color:var(--accent-deep)}
.lawcard .art{white-space:pre-line;font-size:.85rem;line-height:1.75;margin:6px 0 0}
.lawcard .art b{display:block;margin-top:6px}
.ask{background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:.85rem}
.ask b{color:var(--warn)}
.src{font-size:.75rem;color:var(--muted)}
.src a{color:var(--muted)}
.news{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.news b{font-size:.95rem}
.news span{font-size:.75rem;color:var(--muted)}
.season{font-size:.72rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 10px;justify-self:start}
.cat .sug{font-size:.7rem;color:var(--muted)}
.grad{border:1px solid var(--line);border-top:4px solid #c9a227;text-align:center;display:grid;gap:8px}
.grad h2{font-size:1.6rem;letter-spacing:.3em;margin:0}
.grad .gr-role{margin:0;font-weight:700}
.gr-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gr-st div{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:8px 2px}
.gr-st b{font-size:1.15rem}
.gr-st span{font-size:.7rem;color:var(--muted)}
.top .tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fs{display:flex;gap:4px}
.fs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 9px;min-height:30px;font:500 .8rem var(--f-body);cursor:pointer}
.fs button:disabled{opacity:.35;cursor:default}
.thm{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 8px;min-height:30px;font:500 .75rem var(--f-body);cursor:pointer}
.swh{margin:4px 0 0;text-align:center;font-size:.75rem;color:var(--muted)}
.sl-l{animation:slL .22s ease-out}.sl-r{animation:slR .22s ease-out}
@keyframes slL{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.sl-l,.sl-r{animation:none}}
/* 共同知識：比照基礎班的石墨灰，不顯示職務切換 */
.roles[hidden]{display:none}
body[data-role="common"]{--accent:#4A4F57;--accent-soft:#E8E6E1;--accent-deep:#33373D;--bg:#F5F4F1;--on-accent:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-role="common"]{--accent:#C4C8CE;--accent-soft:#2A2D31;--accent-deep:#E2E4E7;--bg:#121315;--on-accent:#141517}}
:root[data-theme="dark"] body[data-role="common"]{--accent:#C4C8CE;--accent-soft:#2A2D31;--accent-deep:#E2E4E7;--bg:#121315;--on-accent:#141517}
/* 加工流程：和基礎班相同 */
.flow{list-style:none;margin:0;padding:0;display:grid}
.flow>li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative}
.flow>li::before{content:"";position:absolute;left:16px;top:32px;bottom:-2px;width:2px;background:var(--line)}
.flow>li:last-child::before{display:none}
.flow .n{width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:grid;place-items:center;font:500 .78rem var(--f-body);color:var(--accent);z-index:1}
.flow li.ccp .n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.flow li.oprp .n{border-color:var(--warn);color:var(--warn)}
.flow li.clean .n{border-style:dashed;border-color:var(--ok);color:var(--ok);font-size:.66rem}
.flow details{padding-bottom:12px;min-width:0}
.flow summary{list-style:none;cursor:pointer;padding-top:4px}
.flow summary::-webkit-details-marker{display:none}
.flow summary .more{float:right;font-size:.75rem;color:var(--accent)}
.flow details[open] summary .more{visibility:hidden}
.pill{display:inline-block;margin-left:6px;font-size:.7rem;padding:1px 8px;border-radius:99px;font-weight:700;vertical-align:2px}
.pill.ccp{background:var(--bad-soft);color:var(--bad)}
.pill.cl{background:var(--ok-soft);color:var(--ok)}
.pill.oprp{background:var(--warn-soft);color:var(--warn)}
.pill.kw{background:var(--accent-soft);color:var(--muted)}
dl.det{margin:8px 0 0;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
dl.det dt{font-size:.76rem;color:var(--muted);font-weight:700}
dl.det dd{margin:0 0 4px}
.qc{border-radius:14px;padding:12px 14px;background:var(--accent-soft);margin-top:8px}
.qc b{color:var(--accent-deep)}
/* 版面比照基礎班：標題列一行、課程卡固定高度（內容在卡內捲動、按鈕固定在底部） */
.top{align-items:center;flex-wrap:wrap}
.top .ttl{display:grid;gap:0;min-width:0}
.top h1,.top .lvl{white-space:nowrap}
.top .lvl{font-size:.7rem;color:var(--muted);letter-spacing:.04em;line-height:1.3}
.top .tr{flex-wrap:nowrap;flex-shrink:0;margin-left:auto}
.deck{display:flex;flex-direction:column;overflow:hidden;padding:0;gap:0;min-height:380px}
.deck>.slide{flex:1;overflow-y:auto;padding:16px 16px 8px;display:grid;gap:14px;align-content:start;-webkit-overflow-scrolling:touch}
.deck>.foot{padding:10px 14px 12px;border-top:1px solid var(--line);flex-shrink:0}
.hteaser{justify-self:start;border:0;border-radius:999px;background:rgba(255,255,255,.2);color:inherit;font:500 .78rem var(--f-body);padding:4px 12px;cursor:pointer;text-align:left}
.hteaser b{font-weight:700}
.top h1{font-size:1.15rem}
/* 常見誤判卡 */
.miss{display:grid;gap:12px}
.mtag{justify-self:start;font-size:.75rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 10px}
.mw{margin:0;display:flex;gap:10px;align-items:flex-start;font:700 1.05rem/1.6 var(--f-body);color:var(--ink)}
.mw .x{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:.8rem;margin-top:3px}
.mwhy,.mfix{border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.mwhy{background:var(--warn-soft)}.mwhy b{color:var(--warn);font-size:.85rem}
.mfix{background:var(--ok-soft)}.mfix b{color:var(--ok);font-size:.85rem}
.mwhy p,.mfix p{margin:0}
/* 時事：食安事件與推薦閱讀（同基礎班） */
.reading{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.reading .src{font-size:.75rem;color:var(--muted)}
.reading a,.reading>b{font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.reading p{margin:0;font-size:.92rem}
.reading dl{margin:0;display:grid;gap:2px}
.reading dt{font-size:.76rem;color:var(--muted);font-weight:700}
.reading dd{margin:0 0 4px;font-size:.92rem}
.reading .rq{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:.9rem}

/* ===== 共同知識卡片（基礎班、進階班共用）===== */
:root{--kx-apricot:#E9893F;--kx-apricot-soft:#FDEBD9;--kx-apricot-ink:#9A4F12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--kx-apricot:#F2A866;--kx-apricot-soft:#3A2A1C;--kx-apricot-ink:#F7C99B}}
:root[data-theme="dark"]{--kx-apricot:#F2A866;--kx-apricot-soft:#3A2A1C;--kx-apricot-ink:#F7C99B}
.kx-tab{display:inline-flex;gap:5px;align-items:center;justify-content:center}.kx-tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kx-wrap{display:grid;gap:12px}
.kx-list{display:grid;gap:10px}
.kx{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.kx>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) 18px;gap:10px;align-items:center;padding:12px}
.kx>summary::-webkit-details-marker{display:none}
.kx>summary:focus-visible,.kx-all:focus-visible{outline:2px solid var(--kx-apricot);outline-offset:2px}
.kx-ic{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 0 0 3px var(--kx-apricot-soft);display:grid;place-items:center;flex:none}
.kx-ic svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kx-ic.sm{width:32px;height:32px}.kx-ic.sm svg{width:18px;height:18px}
.kx-hd{min-width:0;display:grid;gap:6px}
.kx-hd b{font-family:var(--f-display);font-size:1.05rem;line-height:1.3}
.kx-hd b em{font-style:normal;font:500 .72rem var(--f-body);color:var(--muted);margin-left:6px}
.kx-chips{display:flex;flex-wrap:wrap;gap:6px}
.kx-chip{display:inline-grid;line-height:1.15;background:var(--kx-apricot-soft);border-radius:10px;padding:4px 9px}
.kx-chip strong{font:700 1.02rem var(--f-body);color:var(--kx-apricot-ink);font-variant-numeric:tabular-nums}
.kx-chip small{font-size:.7rem;color:var(--muted)}
.kx-chev{width:18px;height:18px;transition:transform .2s;stroke:var(--muted);fill:none;stroke-width:2}
.kx[open]>summary .kx-chev{transform:rotate(180deg)}
.kx-body{padding:0 14px 14px 66px}
.kx-body>ul{margin:0;padding-left:1.1em;display:grid;gap:5px}
.kx-body>ul li{font-size:.94rem}
.kx-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:2px 0}
.kx-all{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.kx-ntop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.kx-stamp{font:600 .74rem var(--f-mono,ui-monospace,monospace);color:var(--kx-apricot-ink);border:1.5px solid var(--kx-apricot);border-radius:6px;padding:1px 6px;transform:rotate(-2deg)}
.kx-src{font-size:.74rem;background:var(--accent-soft);border-radius:99px;padding:1px 9px;color:var(--muted)}
@media (max-width:380px){.kx-body{padding-left:14px}}
@media (prefers-reduced-motion: reduce){.kx-chev{transition:none}}

/* ===== 本週工地（小島）：色票跟著學堂的深淺色 ===== */
:root{--is-prod:#3B5BDB;--is-qa:#1E8A5A;--is-line:#D2602A;--is-sky-a:#CBE8F3;--is-sky-b:#9FD0E4;
  --is-grass:#B3DA90;--is-grass-hi:#C3E3A3;--is-soil:#D2B489;--is-soil-dk:#A88658;--is-soil-ink:#5A472F;--is-rock:#A2876A;--is-road:#E6D9BA;
  --is-shadow:rgba(20,30,20,.20);--is-warn:#E5484D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--is-prod:#7F97F5;--is-qa:#3FB27C;--is-line:#F08A57;--is-sky-a:#1B3A52;--is-sky-b:#102739;
  --is-grass:#4F7D45;--is-grass-hi:#5F8E52;--is-soil:#7A6143;--is-soil-dk:#5A472F;--is-soil-ink:#E9DCC4;--is-rock:#4E3F2B;--is-road:#6E6148;--is-shadow:rgba(0,0,0,.35);--is-warn:#FF6B6F}}
:root[data-theme="dark"]{--is-prod:#7F97F5;--is-qa:#3FB27C;--is-line:#F08A57;--is-sky-a:#1B3A52;--is-sky-b:#102739;
  --is-grass:#4F7D45;--is-grass-hi:#5F8E52;--is-soil:#7A6143;--is-soil-dk:#5A472F;--is-soil-ink:#E9DCC4;--is-rock:#4E3F2B;--is-road:#6E6148;--is-shadow:rgba(0,0,0,.35);--is-warn:#FF6B6F}
#isle[hidden],#isle-q[hidden]{display:none!important}
html.is-lock body{overflow:hidden}
#isle{position:fixed;inset:0;z-index:40;background:var(--tint);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.is-panel{max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid}
.is-head{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.is-head .t{min-width:0;flex:1;display:grid}
.is-head b{font-family:var(--f-display);font-size:1.2rem;line-height:1.3}
.is-eye{font:500 .74rem var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.is-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1rem;cursor:pointer;flex:none}
.is-seg{display:flex;gap:4px;margin:2px 14px 4px;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:3px}
.is-seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 .88rem var(--f-body);padding:6px 4px;border-radius:999px;cursor:pointer}
.is-seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.is-view svg{display:block;width:100%;height:auto}
.is-alert{margin:6px 14px 0;border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.86rem;line-height:1.5;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.is-alert.ev{border-color:var(--is-warn);background:color-mix(in srgb,var(--is-warn) 9%,var(--surface))}
.is-alert.in{border-color:var(--accent);background:var(--accent-soft)}
.is-alert .dot,.is-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--is-warn);animation:is-pulse 1.4s ease-in-out infinite;display:inline-block}
.is-alert.in .dot{background:var(--accent)}
.is-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 12px 2px}
.is-steps div{display:grid;justify-items:center;gap:2px;text-align:center;font-size:.7rem;color:var(--muted);line-height:1.3}
.is-steps i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:500 .7rem var(--f-mono);font-style:normal;color:var(--muted);background:var(--surface)}
.is-steps .on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.is-steps .now i{border-color:var(--accent);color:var(--accent)}
.is-steps .on,.is-steps .now{color:var(--ink)}
.is-tap{padding:2px 14px 0;font-size:.82rem;color:var(--muted);text-align:center;margin:0}
.is-ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 14px 0}
.is-ms div{border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.35}
.is-ms div b{display:block;font-size:.78rem;color:var(--ink)}
.is-ms div.on{border-color:var(--accent);background:var(--accent-soft)}
.is-go{margin:12px 14px 14px;border:0;border-radius:16px;padding:12px 14px;background:linear-gradient(125deg,var(--accent),var(--accent-deep));color:var(--on-accent);display:grid;gap:2px;text-align:left;cursor:pointer}
.is-go b{font-family:var(--f-display);font-size:1.12rem}
.is-go span{font-size:.82rem;opacity:.92}
#isle-q{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.45);display:grid;align-items:end}
.is-qbox{color:var(--ink);padding:4px 16px 18px;display:grid;gap:12px}
.is-ver{margin:0 0 10px;text-align:center;font-size:.68rem;color:var(--muted)}
.is-qbox h3{font-family:var(--f-display);margin:0;font-size:1.08rem;line-height:1.45;text-wrap:balance}
.is-who{display:flex;gap:10px;align-items:center}
.is-who svg{width:44px;height:44px;flex:none}
.is-opts{display:grid;gap:8px}
.is-opts button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;font-size:.94rem;line-height:1.5;cursor:pointer}
.is-opts button.ok{border-color:var(--accent);background:var(--accent-soft)}
.is-opts button.no{border-color:var(--is-warn);background:color-mix(in srgb,var(--is-warn) 9%,var(--surface))}
.is-opts button:disabled{cursor:default;color:var(--ink)}
.is-fbx{border-radius:12px;padding:10px 12px;font-size:.9rem;line-height:1.6;background:var(--tint)}
.is-fbx b{display:block;margin-bottom:2px}
.is-take{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:10px 12px;font-family:var(--f-display);font-size:1.05rem;line-height:1.55}
.is-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;font:500 .95rem var(--f-body);cursor:pointer;justify-self:start}
.is-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.is-strip{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px;padding:6px 12px 6px 6px;border:1px solid var(--line);background:var(--surface);border-radius:16px;text-align:left;color:var(--ink);cursor:pointer;width:100%;margin-bottom:10px;font:inherit}
.is-strip svg{width:118px;height:auto;border-radius:11px;display:block}
.is-st{display:grid;min-width:0}
.is-st b{font-family:var(--f-display);font-size:.98rem;line-height:1.3}
.is-st span{font-size:.78rem;color:var(--muted)}
.is-st em{font-style:normal;color:var(--accent);font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:6px}
.is-cel{width:100%;display:grid;justify-items:center;gap:4px}
.is-cel svg{width:100%;max-width:360px;max-height:34vh;height:auto;border-radius:14px;display:block}
.is-celtag{font-size:.82rem;color:var(--accent);font-weight:700}
.celebrate:has(.is-cel){justify-content:flex-start;overflow-y:auto;gap:8px;padding:14px}
.is-areacard{display:grid;gap:4px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:6px 6px 10px;cursor:pointer;color:var(--ink);text-align:center;font:inherit;margin-bottom:12px}
.is-areacard svg{width:100%;height:auto;border-radius:12px;display:block}
.is-areacard b{display:block;font-size:.95rem}

<script>
const DATA = {"roles": {"prod": "生管", "qa": "衛管", "line": "生產主管"}, "order": ["prod", "qa", "line"], "flows": {"chain": {"name": "農場到出貨", "start": {"t": "源頭：農場與牧場", "i": "水果、生乳等原料的品質與安全，從種植和飼養就開始。選擇供應商時，要了解他們的用藥與管理方式。"}, "end": {"t": "交給消費者", "i": "這套課程聚焦在工廠內到出貨為止。產品到了消費者手上，任何一段沒守住，結果都由消費者承擔。"}, "steps": [{"n": "供應商管理", "k": "衛管・採購", "p": "選對供應商，源頭就把風險降低。", "c": "供應商評核、原料規格書、定期稽核。", "r": "源頭有農藥、動物用藥或摻假問題，後面再怎麼做都救不回來。"}, {"n": "原料驗收與放行", "k": "衛管", "p": "確認這一批符合規格才能使用。", "c": "核對 COA、現場檢查、抽驗；合格才貼放行標示。", "r": "不合格原料流入產線，影響所有用到它的成品。"}, {"n": "原料倉儲", "k": "倉管・生管", "p": "維持原料品質直到使用。", "c": "溫度紀錄、先到期先出、物料狀態分區標示。", "r": "過期或狀態不明的原料被誤用。"}, {"n": "生產", "k": "生產主管", "p": "依標準做出安全的產品。", "c": "CCP 與 OPRP 監控、清潔、首件、交叉汙染管制。", "r": "偏離沒被發現，整批產品都可能不安全。"}, {"n": "成品檢驗與放行", "k": "衛管", "p": "確認整批合格才出廠。", "c": "紀錄審查、檢驗、正向放行、留樣。", "r": "先出貨再發現不合格，只能從客戶手上回收。"}, {"n": "成品入庫", "k": "倉管・生管", "p": "保存條件正確，效期管理清楚。", "c": "冷藏冷凍溫度、離牆離地、庫齡與即期品管理。", "r": "回溫、滯留過久，或剩餘效期不符客戶要求。"}, {"n": "出貨", "k": "物流", "p": "冷鏈不中斷，把產品完整交出去。", "c": "車輛預冷、溫度紀錄、出貨核對批號與效期。", "r": "溫度失控或送錯批號，前面的努力就白費。"}], "qc": "整條鏈的共同語言是「批號」：每一段都留下批號紀錄，出事時才能在幾小時內追到源頭與去向。"}, "yogurt": {"name": "優格", "start": {"t": "開工前：SIP 熱水殺菌", "i": "以熱水對管路與設備殺菌，確認殺菌溫度、時間與清潔都完成並記錄，才可開機。"}, "end": {"t": "收工後：CIP 清潔", "i": "一般流程為預沖洗 → 鹼洗 → 沖洗 → 酸洗 → 沖洗。最後以 pH 試紙或導電度確認沖洗水恢復中性、無清潔劑殘留，並記錄。"}, "steps": [{"n": "原料驗收", "k": "效期、溫度", "p": "確保生乳安全與新鮮。", "c": "核對效期、量測溫度、檢查包裝與供應商文件，填寫驗收紀錄。", "r": "溫度過高或效期不足時，拒收或隔離待判定。"}, {"n": "倉儲", "k": "", "p": "維持原料品質直到使用。", "c": "依本廠規定的溫度冷藏、不可結凍；標示批號與到期日。", "r": "冷藏庫溫度異常、不同批混放。"}, {"n": "倒料", "k": "先進先出", "p": "依序使用原料，並保留追溯資料。", "c": "依批號與效期順序取用，記錄投料批號。", "r": "跳批使用，舊批過期報廢；投料批號沒記錄，無法追溯。"}, {"n": "加熱（巴氏殺菌）", "k": "", "ccp": 1, "p": "殺滅病原菌，並讓乳清蛋白變性，提升優格稠度。", "c": "溫度與時間連續監控並記錄，依本廠 HACCP 計畫的管制界限判定。", "r": "溫度不足或紀錄中斷：立即隔離、評估，無法證實就不得放行。"}, {"n": "冷卻", "k": "", "p": "降到適合接菌的溫度。", "c": "確認冷卻後的溫度並記錄。", "r": "冷卻不足或過度，影響發酵。"}, {"n": "加乳酸菌", "k": "", "p": "加入菌種啟動發酵。", "c": "菌種品項、批號、效期與添加量，雙人確認。", "r": "投入量錯誤；菌種保存不當造成活性下降。"}, {"n": "充填", "k": "效期、重量", "p": "把優格分裝到杯中。", "c": "首件確認杯、蓋、標籤、效期；抽檢封口與重量。凝固型優格充填後要盡快進入發酵室。", "r": "封口不良、效期印錯、重量不足、充填後等待過久。"}, {"n": "發酵", "k": "", "p": "乳酸菌產酸，使乳蛋白凝結成形。", "c": "依本廠規定的溫度與時間發酵，記錄發酵室溫度、時間與終點 pH。", "r": "發酵過長或過短，造成酸度與質地異常。"}, {"n": "冷藏", "k": "", "p": "快速降溫，停止發酵並保存。", "c": "依本廠規定的溫度冷藏，記錄溫度。", "r": "降溫太慢會持續產酸，產品變酸（後酸化）。"}, {"n": "出貨", "k": "效期", "p": "把合格產品送到客戶手上。", "c": "確認放行狀態、效期、批號，以及出貨與車廂溫度。", "r": "等車過久造成溫度上升。"}], "qc": "質地（凝結狀態、是否離水）、pH（確認發酵終點）、品評（風味、酸度、口感），並確認效期與重量。不合格品隔離待判定。"}, "icecream": {"name": "優格冰", "start": {"t": "開工前：熱水清洗機器", "oprp": 1, "i": "開工前的熱水清洗是保護產品的關鍵。依本廠規定的溫度使用煮過的熱水，讓熱水流過冰淇淋機內部完成清洗，並在出水口確認水溫達本廠規定的下限，記錄水溫與時間；出水溫度未達下限不得投產，要重新清洗並通知衛管。秤具、均質機、冷藏桶也要確認清潔乾燥。"}, "end": {"t": "收工後：拆洗與消毒", "i": "當日最後一個口味完成後，拆洗冰淇淋機與充填機接觸面、消毒並記錄；清點拆下的零件與工具，確認沒有遺失或破損，再組回或歸位。"}, "steps": [{"n": "備料", "k": "先進先出、確認今日口味", "p": "依今天的排程準備原料與包材，避免用錯料、用到過期料。", "c": "核對今日口味與數量；原料依先進先出取用，同時確認效期，快到期的優先使用；包材與標籤要和口味一致。", "r": "拿錯口味的香料或醬料；效期過期或沒標開封日；標籤版本拿錯。發現就退回並通知生管。"}, {"n": "秤料", "k": "雙人核對", "p": "依配方準確秤量每一種原料。", "c": "使用校正有效期內的秤；照配方逐項秤量並勾選，雙人核對；含過敏原的原料（例如堅果、蛋）分開秤、分開放。", "r": "漏加或重複加料；秤具未歸零；過敏原原料混用工具。發現時停止投料，通知主管與衛管判定。"}, {"n": "均質", "k": "", "p": "把脂肪球打碎變小，讓口感滑順、結構穩定。", "c": "記錄均質壓力與溫度；確認混合液沒有結塊或分層。", "r": "壓力不足造成口感粗糙、油水分離。優格冰依本廠 HACCP 計畫管控，均質機的清潔與原料品質特別重要。"}, {"n": "冷藏備用", "k": "溫度、時間", "p": "讓混合液降溫並暫存，等待上機製冰。", "c": "依本廠規定的溫度冷藏；容器標示口味、批號與製作時間；依本廠規定的存放時間上限使用，先做的先用。溫度和時間是抑制雜菌的重要防線，依本廠 HACCP 計畫管控。", "r": "冷藏溫度偏高，或放太久超過時限：隔離並交衛管評估。容器沒標示：無法確認時間就不得使用。"}, {"n": "冰淇淋機入料製冰", "k": "膨脹率", "p": "一邊冷凍、一邊攪拌打入空氣，形成冰淇淋的口感與體積。", "c": "入料前確認口味與容器標示一致；監控出料溫度與膨脹率；機器運轉中不可伸手進入。", "r": "膨脹率過高，產品偏輕、可能不符標示淨重；出料太軟，後段成形不好。依規格調整並記錄。"}, {"n": "依規格裝填（秤重）", "k": "淨重、標籤、效期", "p": "把冰淇淋裝成規格包裝，並確認重量與標示正確。", "c": "開機與換口味後做首件確認：口味、標籤、效期、批號、過敏原標示；依頻率抽檢淨重，看平均也看最小值。", "r": "重量不足、標籤或效期印錯：停機調整，隔離可疑產品並重新確認。"}, {"n": "急速冷凍", "k": "越快越好", "p": "快速把產品降到冷凍溫度，讓冰晶保持細小、口感滑順。", "c": "裝填後盡快送進急凍設備，不在室溫等待；記錄急凍時間與產品溫度。", "r": "等待太久或急凍溫度不足：冰晶變大、口感變粗；表面融化又冷凍要交衛管評估。"}, {"n": "換口味洗機器", "k": "淺到深、無過敏原先做", "p": "避免口味混雜與過敏原交叉接觸。", "c": "排程原則：淺色先、深色後；不含過敏原的先做，含過敏原的放最後。換口味時拆洗接觸面、清線確認並記錄；拆下的零件要清點。", "r": "洗不乾淨造成口味殘留或過敏原交叉接觸；零件遺失沒發現可能混入產品。零件找不到時，立即停線並隔離產品。"}, {"n": "入庫", "k": "溫度紀錄、離牆離地", "p": "把成品存放在穩定的冷凍環境，等待出貨。", "c": "冷凍庫依本廠規定的溫度存放並記錄；棧板離牆離地、不擋出風口；依批號與效期擺放，先到期的放出口端。", "r": "庫溫波動或靠牆堆放造成局部回溫：量產品溫度並交衛管評估。"}, {"n": "出貨", "k": "冷鏈、效期", "p": "把合格產品安全送到客戶手上。", "c": "確認產品已放行；核對效期、批號與數量；記錄出庫到上車的時間與車廂溫度，盡量縮短等車時間。", "r": "等車過久表面融化：不可直接再冷凍出貨，要交衛管評估。"}], "qc": "秤重（淨重是否符合標示，也反映膨脹率）、品評（外觀、冰晶口感、風味），並確認效期標示正確。"}, "jam": {"name": "果醬", "start": {"t": "開工前：設備與器具清潔", "i": "確認烹煮鍋、刀具、砧板、充填設備已清潔消毒；清點刀具數量並記錄。"}, "end": {"t": "收工後：清潔與刀具清點", "i": "拆洗設備與器具、消毒並記錄；再次清點刀具，確認沒有遺失或破損。"}, "steps": [{"n": "驗收", "k": "農藥、效期", "p": "確保水果原料安全。", "c": "確認農藥殘留檢驗報告或快篩紀錄、效期、外觀；冷凍原料要量測溫度。", "r": "農藥超標或腐爛比例過高時拒收。"}, {"n": "挑選", "k": "", "p": "去除腐爛、破損、發霉的水果。", "c": "依標準樣品或照片判定，記錄剔除量。", "r": "發霉原料混入，可能帶有真菌毒素。"}, {"n": "清洗", "k": "", "p": "去除泥沙、灰塵與表面汙染。", "c": "用水符合標準；清洗方式與時間依標準作業。", "r": "清洗不足，殘留泥沙或汙染。"}, {"n": "挑選", "k": "異物、昆蟲", "p": "清洗後再次挑出異物與昆蟲。", "c": "光源充足；記錄異物的種類與數量。", "r": "漏挑，造成客訴。"}, {"n": "裁切／退冰", "k": "", "p": "處理成適合烹煮的大小與狀態。", "c": "刀具清點與破損檢查；退冰在控溫環境下進行。", "r": "刀具碎片混入；退冰溫度過高讓微生物增生。"}, {"n": "烹煮", "k": "", "ccp": 1, "p": "濃縮、殺菌，並讓果膠形成凝膠。", "c": "溫度與時間記錄，依本廠 HACCP 計畫的管制界限判定。", "r": "加熱不足時隔離評估。"}, {"n": "糖度", "k": "", "p": "確認濃縮程度，影響保存性與凝膠。", "c": "用糖度計測 Brix，達規格才停止烹煮並記錄。", "r": "糖度不足，保存性與凝膠不良。"}, {"n": "裝瓶", "k": "效期、重量", "p": "熱充填並封蓋。", "c": "確認充填溫度、瓶蓋封合；首件確認標籤與效期；抽檢重量與異物。", "r": "封蓋不良、效期印錯、重量不足。"}], "qc": "pH（一般遠低於 4.6，依本廠規格判定）、品評（色澤、凝膠、風味、異物），並確認效期與重量。"}}, "weeks": [{"title": {"prod": "插單與排程變更", "qa": "放行判斷與偏差處置", "line": "從組長到主管"}, "lessons": {"prod": [{"title": "插單的真正代價", "slides": [[{"k": "head", "t": "插單的真正代價", "g": "業務插單時，3 分鐘內算出「接這張單要付出什麼」，而不是只回答可以或不行。"}, {"k": "story", "t": "週三下午，業務傳訊息：「客戶追加 1,500 杯草莓優格冰，週五要。」排程已經排到週六。你直覺想說不行，但知道主管一定會問：「為什麼不行？」"}, {"k": "pred", "key": "pp1-1", "q": "插單最容易被忽略的代價是什麼？", "o": ["被往後推的其他訂單，和多出來的換線", "業務要多跑一趟客戶", "多用掉的原料"], "a": 0, "y": "原料大家都會算。真正容易漏的是：插進來的單會把後面的訂單往後推，還會多一次換口味的清洗或清線。"}], [{"k": "pts", "t": "插單的四種代價", "ord": true, "i": ["換線與清線：多一次換口味；遇到過敏原要完整清線，依本廠規定。", "延後的訂單：哪幾張會晚、晚多久、是哪個客戶。", "加班與人力：要加班多久，有沒有超過加班上限。", "原料與包材：夠不夠，要不要急件採購。"]}], [{"k": "miss", "w": "業務說很急，先答應再說，排程之後再擠。", "why": "插單的代價不會消失，只是轉到別張單：被延後的訂單、多出的換線和加班，最後都要有人承擔。先答應，等於替別人做了決定。", "fix": "先花 3 分鐘算出會影響哪幾張單、多幾次換線、要不要加班，再回覆「可以，但代價是…」。"}], [{"k": "quiz", "key": "qp1-1", "q": "週四原本的排程是原味 6 小時 → 抹茶 2 小時。草莓 1.5 小時要插在原味和抹茶中間；每次換口味清洗 20 分鐘（示意）。抹茶會延後多久開始？", "o": ["1 小時 30 分", "1 小時 50 分", "2 小時 10 分"], "a": 1, "y": "第一步：多了草莓 1.5 小時。第二步：原本只換一次口味，現在要換兩次，多一次 20 分鐘清洗。1 小時 30 分＋20 分＝1 小時 50 分。", "two": true}], [{"k": "take", "t": "插單先算代價，再談可不可以。"}, {"k": "back", "t": "確認本廠插單有沒有固定的評估方式和回覆時限。"}, {"k": "reflect", "q": "最近一次插單，你有算出它推遲了哪幾張單嗎？"}]], "mins": 2}, {"title": "給選項，不是給答案", "slides": [[{"k": "head", "t": "給選項，不是給答案", "g": "把評估結果整理成 2–3 個選項，附上代價，讓有權決定的人選。"}, {"k": "story", "t": "你算出接下插單，會讓週五一張量販單晚半天。業務不耐煩：「那你說到底接不接？」"}, {"k": "pred", "key": "pp1-2", "q": "要不要接插單，應該由誰決定？", "o": ["生管，因為最懂排程", "業務，因為客戶是他的", "有權衡量客戶優先順序的主管；生管提供選項與代價"], "a": 2, "y": "延後哪個客戶是商業判斷，不是排程技術。生管把選項和代價算清楚，決定交給有權責的人。"}], [{"k": "pts", "t": "每個選項都寫三件事", "ord": true, "i": ["做法：例如全數接、分批出貨、改期、先出庫存。", "代價：誰的單會晚、晚多久、多花多少加班。", "風險：原料、人力、品質有沒有做不到的可能。"]}], [{"k": "miss", "w": "把分析結果整理好，直接告訴主管「我建議 A」就好。", "why": "只給一個答案，主管看不到被放棄的選項和代價，只能照單全收或整個打回來；你也會被當成唯一的責任人。", "fix": "列 2–3 個選項，每個寫清楚代價和風險，最後才加一句你的建議和理由，讓有權的人選。"}], [{"k": "quiz", "key": "qp1-2", "q": "客戶要 1,500 杯草莓優格冰週五到。庫存有 600 杯；週四只能擠出 1 小時產線時間，速度每小時 1,200 杯，換口味清洗要 20 分鐘（示意）。哪個說法正確？", "o": ["庫存不能動，只能全部改期", "1 小時能做 1,200 杯，加庫存共 1,800 杯，全數準時沒問題", "1 小時扣掉清洗只剩 40 分鐘，約做 800 杯，加庫存共 1,400 杯，還差 100 杯；可提議週五先出 1,400 杯、其餘週六補"], "a": 2, "y": "第一步：1 小時要先扣 20 分鐘清洗，剩 40 分鐘，40 ÷ 60 × 1,200＝800 杯。第二步：800＋600＝1,400 杯，差 100 杯。把差額講清楚，才能談分批。", "two": true}], [{"k": "take", "t": "生管的工作是讓決定變容易，不是代替別人決定。"}, {"k": "back", "t": "看本廠回覆插單時，有沒有寫出每個選項的代價。"}, {"k": "reflect", "q": "下次插單，你會給哪兩個選項？各自的代價是什麼？"}]], "mins": 3}, {"title": "排程變了，通知要到位", "slides": [[{"k": "head", "t": "排程變了，通知要到位", "g": "排程變更時，30 秒列出要通知 其他供應商的果泥，馬上投產", "bad", "未經評估的替代料，可能帶來新的風險和標示問題。"], ["用已核准的替代批號先做一半；另一半和業務協調延後，並更新排程通知產線與衛管", "good", "只用已核准的料，並讓所有人知道新的計畫。"]]}, {"role": "line", "story": "週五早上。一位組員清潔時袖子被捲到，幸好沒受傷。他很緊張，怕被罵。", "storyBad": null, "q": "生產主管：怎麼處理？", "o": [["提醒他小心，繼續趕工", "bad", "危害還在，大家也學會以後不要說。"], ["謝謝他說出來，先停機檢查，確認清潔時的停機程序；工安改善排進下週", "good", "讓回報變安全，也處理了危害。"], ["停線一整天檢討", "mid", "重視安全，但停線一整天的影響太大，可以更有效率地處理。"]]}, {"role": "qa", "story": "週五下午。週會要報告這一週。主管問：「這週最該記住的是什麼？」", "storyBad": null, "q": "衛管：怎麼總結？", "o": [["用一頁整理：異常果泥的原因與供應商回覆、險些事故的對策、下週要追蹤的事與負責人", "good", "把一週的經驗變成下次的改善。"], ["「都是供應商的問題。」", "bad", "把責任推出去，自己的流程就不會改善。"], ["「這週很忙，大家辛苦了。」", "mid", "表達了感謝，但沒有留下可以改進的東西。"]]}], "ends": {"E1": {"t": "撐過旺季，還變得更好", "d": "每一輪都守住原則、說清楚資訊、照顧到人，這一週的經驗也留了下來。"}, "E2": {"t": "撐過去了", "d": "大部分都處理得很好，有一兩個地方可以更好。"}, "E3": {"t": "有點驚險", "d": "這一週過去了，但有幾個環節差一點出事。"}, "E4": {"t": "下週會更辛苦", "d": "承諾過頭、原則鬆動、人員過勞，問題會延續到下一週。"}}, "keys": ["插單先看瓶頸，說清楚缺口。", "原料異常先隔離，只用已核准的料。", "險些事故要讓人敢說，安全的做法要排進時間。"], "season": null, "mins": 8}}], "motifs": {"prod": ["calendar", "people", "chart", "grid", "list", "funnel", "leaf", "box", "shield", "hourglass", "truck", "coin", "scale", "cycle", "gauge", "trophy"], "qa": ["release", "hazard", "thermo", "chart", "petri", "drop", "nut", "cycle", "truck", "hourglass", "search", "wrench", "list", "people", "tag", "trophy"], "line": ["people", "ladder", "bell", "hand", "star", "list", "gauge", "cycle", "wrench", "search", "grid", "helmet", "calendar", "chat", "scale", "trophy"]}, "motifPaths": {"release": "<rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2.5h6V4\"/><path d=\"M8.5 13l2.5 2.5 4.5-5\"/>", "hazard": "<path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4.5M12 17.5v.2\"/>", "thermo": "<path d=\"M10 4a2 2 0 014 0v10a4 4 0 11-4 0z\"/><path d=\"M12 9v7\"/>", "chart": "<path d=\"M3 20h18M4 16l5-5 4 3 6-8\"/>", "petri": "<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"9\" cy=\"10\" r=\"1.3\"/><circle cx=\"14.5\" cy=\"9\" r=\"1\"/><circle cx=\"13\" cy=\"1  7h-.5a6 6 0 01-4.6-2.2L3.5 15a1.6 1.6 0 012.5-2l2 2\"/>", "grid": "<rect x=\"3\" y=\"3\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><rect x=\"3\" y=\"13.5\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"13.5\" width=\"7.5\" height=\"7.5\" rx=\"1.5\"/>", "helmet": "<path d=\"M3 17h18M5 17a7 7 0 0114 0\"/><path d=\"M10 10V7h4v3\"/>", "scale": "<path d=\"M12 3v18M5 21h14M4 8h16M4 8l-2.5 6a3 3 0 005 0zM20 8l-2.5 6a3 3 0 005 0z\"/>", "chat": "<path d=\"M4 5h16v11H9l-5 4z\"/><path d=\"M8 9h8M8 12.5h5\"/>", "shield": "<path d=\"M12 3l8 3v6c0 4.5-3.5 7.5-8 9-4.5-1.5-8-4.5-8-9V6z\"/><path d=\"M8.5 12l2.5 2.5 4.5-5\"/>", "star": "<path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"/>", "eye": "<path d=\"M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>"}, "gloss": {"HACCP": "危害分析重要管制點系統：找出食品製程中的危害，訂出要管住的步驟、界限與監控方法。", "CCP": "重要管制點：能把顯著危害降到可接受程度、而且後面沒有其他步驟能補救的步驟，要有明確的管制界限。", "OPRP": "操作性前提方案：針對顯著危害，用「行動準則」管控的措施；偏離時要評估受影響的產品。", "PRP": "前提方案：維持衛生環境的基本條件，例如人員衛生、清潔、病媒防治、用水。", "管制界限": "CCP 用來判定合格或不合格的明確數值或條件，依本廠 HACCP 計畫訂定。", "行動準則": "OPRP 用來判斷管控是否有效的可量測或可觀察標準。", "顯著危害": "經過嚴重性與可能性評估後，必須用管制措施控制的危害。", "確效": "事前用證據證明一項管制措施能達到預期效果。", "驗證": "事後確認管制措施有照計畫執行、而且持續有效。", "正向放行": "確認檢驗與紀錄都合格之後，才允許產品出廠。", "留樣": "每批成品保留的樣品，客訴或異常時拿來比對。", "交叉接觸": "過敏原從一個產品，經由設備、器具或人員，跑到另一個不含該過敏原的產品。", "清線": "換口味或換產品時的清潔；遇到過敏原要依本廠規定做完整清線。", "管制圖": "把數據依時間畫成圖，加上平常範圍的上下界，用來看出異常或趨勢。", "抽樣計畫": "規定一批要抽幾個樣品、可接受幾個不合格，以及判定的界限。", "環境監測": "在生產環境採樣檢驗，提早找出病原菌或衛生問題藏在哪裡。", "大腸桿菌群": "常用的衛生指標菌，數量偏高代表清潔或製程衛生可能有問題。", "李斯特菌": "能在冷藏溫度下緩慢生長的病原菌，容易藏在潮濕的排水溝和設備死角。", "生物膜": "細菌附著在表面並包上一層保護膜，一般沖洗很難去除。", "COA": "檢驗報告：供應商提供的批次檢驗結果。", "食品詐欺": "為了經濟利益，故意摻假、以次充好或不實標示原料或產品。", "矯正措施": "針對已發生的問題找出原因並消除，避免再發生。", "根本原因": "問到「再問也沒有更深原因、而且改了就不會再發生」的那一層原因。", "5 Why": "連續問「為什麼」，從表面現象追到可以改善的根本原因。", "S&OP": "產銷協調會議：每月對齊需求、產能與庫存，一起決定缺口怎麼補。", "主生產排程": "未來幾週每個產品要做多少、哪一週做的計畫，是備料與排班的依據。", "MRP": "物料需求計畫：依生產計畫與配方用量，算出什麼時候要備多少料。", "安全庫存": "為了應付需求波動與交期延誤，額外保留的庫存。", "前置時間": "從下單到原料可以用、或從開始生產到可以出貨所需要的時間。", "瓶頸": "整條產線中最慢的那一站，決定整條線的產出。", "OEE": "設備總合效率＝稼動率 × 性能率 × 良率，用來看設備時間被用掉多少。", "六大損失": "造成 OEE 下降的六類損失：故障、換線調整、小停機、速度降低、開機不良、製程不良。", "換線": "從一個產品或口味切換到另一個的過程，包含停機、清潔、調整與首件確認。", "外部作業": "換線時不用停機、可以提前或事後做的工作，例如備料、備標籤。", "內部作業": "換線時必須停機才能做的工作，例如拆洗、更換模具。", "小停機": "幾分鐘內就恢復、但次數很多的停機，常被忽略。", "自主保養": "由操作人員自己做的日常點檢、清潔、上油與小調整。", "上鎖掛牌": "清潔或維修前，把設備能源切斷並上鎖、掛牌，防止被誤啟動。", "技能矩陣": "列出每位組員會哪些工站、熟練到什麼程度的表，用來安排訓練與代理。", "多能工": "會操作兩個以上工站的組員，人力不足時可以支援。", "允收期": "客戶收貨時要求產品至少還剩多少效期，常用比例表示。", "即期品": "剩餘效期已經不多、需要優先處理的原料或產品。", "庫齡": "產品或原料入庫到現在的天數。", "物料平衡": "核對一批原料進來多少、用掉多少、剩多少，數字對得起來才代表紀錄可信。", "標準成本": "事先訂好的單位成本，用來和實際成本比較，看差異從哪裡來。", "變動成本": "隨產量增減的成本，例如原料、包材。", "固定成本": "不隨產量增減的成本，例如租金、設備折舊、固定薪資。", "邊際貢獻": "售價減掉變動成本，代表每多賣一個能拿來分攤固定成本的金額。", "達交率": "準時、足量交貨的訂單數，占全部訂單數的比例。", "SBI": "回饋的三段結構：情境（Situation）、行為（Behavior）、影響（Impact）。", "A3": "把一個問題的背景、現況、原因、對策與追蹤寫在一張紙上的提案方法。", "變形工時": "依法經同意後，把幾週內的正常工時重新分配的制度，只適用於指定行業。", "勞資會議": "雇主與勞工代表定期協商的會議；沒有工會的事業單位，部分工時調整要經它同意。", "工作規則": "僱用 30 人以上的雇主依法要訂的規定，包含工時、紀律、獎懲等，要報主管機關核備。", "食安文化": "全廠從主管到組員，對食品安全共同的想法與做法，看的是沒人監督時大家怎麼做。"}, "laws": {"src": {"name": "全國法規資料庫《勞動基準法》", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=N0030001", "amended": "民國 113 年 07 月 31 日", "checked": "2026-10-22"}, "cards": [{"key": "flex", "t": "變形工時", "arts": ["第 30 條", "第 30 條之 1", "第 36 條"], "points": ["正常工時每日不超過 8 小時、每週不超過 40 小時。", "經工會（沒有工會則經勞資會議）同意，可以把 2 週、8 週或 4 週內的工時重新分配，但各有上限。", "這些變形工時只適用於中央主管機關指定的行業。", "出勤紀錄要逐日記到分鐘，保存 5 年。"], "ask": "本廠屬不屬於指定行業、採用哪一種變形工時、是否已經勞資會議同意，先和人資確認。", "text": {"第 30 條": "勞工正常工作時間，每日不得超過八小時，每週不得超過四十小時。\n前項正常工作時間，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將其二週內二日之正常工作時數，分配於其他工作日。其分配於其他工作日之時數，每日不得超過二小時。但每週工作總時數不得超過四十八小時。\n第一項正常工作時間，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將八週內之正常工作時數加以分配。但每日正常工作時間不得超過八小時，每週工作總時數不得超過四十八小時。\n前二項規定，僅適用於經中央主管機關指定之行業。\n雇主應置備勞工出勤紀錄，並保存五年。\n前項出勤紀錄，應逐日記載勞工出勤情形至分鐘為止。勞工向雇主申請其出勤紀錄副本或影本時，雇主不得拒絕。\n雇主不得以第一項正常工作時間之修正，作為減少勞工工資之事由。\n第一項至第三項及第三十條之一之正常工作時間，雇主得視勞工照顧家庭成員需要，允許勞工於不變更每日正常工作時數下，在一小時範圍內，彈性調整工作開始及終止之時間。", "第 30 條之 1": "中央主管機關指定之行業，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，其工作時間得依下列原則變更：\n一、四週內正常工作時數分配於其他工作日之時數，每日不得超過二小時，不受前條第二項至第四項規定之限制。\n二、當日正常工作時間達十小時者，其延長之工作時間不得超過二小時。\n三、女性勞工，除妊娠或哺乳期間者外，於夜間工作，不受第四十九條第一項之限制。但雇主應提供必要之安全衛生設施。\n依中華民國八十五年十二月二十七日修正施行前第三條規定適用本法之行業，除第一項第一款之農、林、漁、牧業外，均不適用前項規定。", "第 36 條": "勞工每七日中應有二日之休息，其中一日為例假，一日為休息日。\n雇主有下列情形之一，不受前項規定之限制：\n一、依第三十條第二項規定變更正常工作時間者，勞工每七日中至少應有一日之例假，每二週內之例假及休息日至少應有四日。\n二、依第三十條第三項規定變更正常工作時間者，勞工每七日中至少應有一日之例假，每八週內之例假及休息日至少應有十六日。\n三、依第三十條之一規定變更正常工作時間者，勞工每二週內至少應有二日之例假，每四週內之例假及休息日至少應有八日。\n雇主使勞工於休息日工作之時間，計入第三十二條第二項所定延長工作時間總數。但因天災、事變或突發事件，雇主有使勞工於休息日工作之必要者，其工作時數不受第三十二條第二項規定之限制。\n經中央目的事業主管機關同意，且經中央主管機關指定之行業，雇主得將第一項、第二項第一款及第二款所定之例假，於每七日之週期內調整之。\n前項所定例假之調整，應經工會同意，如事業單位無工會者，經勞資會議同意後，始得為之。雇主僱用勞工人數在三十人以上者，應報當地主管機關備查。"}}, {"key": "comp", "t": "加班換補休", "arts": ["第 32 條之 1"], "points": ["加班或休息日出勤後，要勞工自己選擇補休、並經雇主同意，才能換補休。", "補休時數依實際工作時數計算。", "補休期限由勞雇雙方協商；期限到了或離職時沒休完，要依當天的加班工資標準發給工資。"], "ask": "本廠補休期限怎麼約定、怎麼記錄，先和人資確認。", "text": {"第 32 條之 1": "雇主依第三十二條第一項及第二項規定使勞工延長工作時間，或使勞工於第三十六條所定休息日工作後，依勞工意願選擇補休並經雇主同意者，應依勞工工作之時數計算補休時數。\n前項之補休，其補休期限由勞雇雙方協商；補休期限屆期或契約終止未補休之時數，應依延長工作時間或休息日工作當日之工資計算標準發給工資；未發給工資者，依違反第二十四條規定論處。"}}, {"key": "rest", "t": "例假與休息日出勤", "arts": ["第 36 條", "第 39 條", "第 40 條"], "points": ["每 7 天要有 1 天例假、1 天休息日。", "休息日出勤的時數，計入每月加班總時數。", "例假只有遇到天災、事變或突發事件時才能停止，工資要加倍、事後補假，並在 24 小時內報主管機關核備。", "例假、休息日、休假、特休的工資照給。"], "ask": "什麼情況算「突發事件」、要不要報備，先和人資確認，不要自行判斷。", "text": {"第 39 條": "第三十六條所定之例假、休息日、第三十七條所定之休假及第三十八條所定之特別休假，工資應由雇主照給。雇主經徵得勞工同意於休假日工作者，工資應加倍發給。因季節性關係有趕工必要，經勞工或工會同意照常工作者，亦同。", "第 40 條": "因天災、事變或突發事件，雇主認有繼續工作之必要時，得停止第三十六條至第三十八條所定勞工之假期。但停止假期之工資，應加倍發給，並應於事後補假休息。\n前項停止勞工假期，應於事後二十四小時內，詳述理由，報請當地主管機關核備。"}}, {"key": "mother", "t": "母性保護", "arts": ["第 49 條", "第 50 條", "第 51 條", "第 52 條"], "points": ["女性勞工晚上 10 點到隔天早上 6 點工作，要經工會或勞資會議同意，並提供安全衛生設施與交通或宿舍。", "妊娠或哺乳期間的女性勞工，不適用上面的例外。", "分娩前後產假 8 星期；妊娠 3 個月以上流產，產假 4 星期。", "妊娠期間可以申請改調較輕易的工作，雇主不得拒絕，也不得減薪。", "子女未滿 1 歲需親自哺乳，每天另給哺乳時間 2 次、每次 30 分鐘，算工作時間。"], "ask": "排夜班、調整職務或安排哺乳時間前，先和人資確認本廠的做法。", "text": {"第 49 條": "雇主不得使女工於午後十時至翌晨六時之時間內工作。但雇主經工會同意，如事業單位無工會者，經勞資會議同意後，且符合下列各款規定者，不在此限：\n一、提供必要之安全衛生設施。\n二、無大眾運輸工具可資運用時，提供交通工具或安排女工宿舍。\n前項第一款所稱必要之安全衛生設施，其標準由中央主管機關定之。但雇主與勞工約定之安全衛生設施優於本法者，從其約定。\n女工因健康或其他正當理由，不能於午後十時至翌晨六時之時間內工作者，雇主不得強制其工作。\n第一項規定，於因天災、事變或突發事件，雇主必須使女工於午後十時至翌晨六時之時間內工作時，不適用之。\n第一項但書及前項規定，於妊娠或哺乳期間之女工，不適用之。", "第 50 條": "女工分娩前後，應停止工作，給予產假八星期；妊娠三個月以上流產者，應停止工作，給予產假四星期。\n前項女工受僱工作在六個月以上者，停止工作期間工資照給；未滿六個月者減半發給。", "第 51 條": "女工在妊娠期間，如有較為輕易之工作，得申請改調，雇主不得拒絕，並不得減少其工資。", "第 52 條": "子女未滿一歲須女工親自哺乳者，於第三十五條規定之休息時間外，雇主應每日另給哺乳時間二次，每次以三十分鐘為度。\n前項哺乳時間，視為工作時間。"}}, {"key": "rules", "t": "工作規則與懲處程序", "arts": ["第 70 條", "第 71 條"], "points": ["僱用 30 人以上，要訂工作規則，報主管機關核備並公開揭示。", "工作規則要涵蓋紀律、考勤、請假、獎懲等事項。", "工作規則違反法令的強制或禁止規定，無效。"], "ask": "懲處前先查本廠工作規則怎麼寫，並和人資確認程序。", "text": {"第 70 條": "雇主僱用勞工人數在三十人以上者，應依其事業性質，就左列事項訂立工作規則，報請主管機關核備後並公開揭示之：\n一、工作時間、休息、休假、國定紀念日、特別休假及繼續性工作之輪班方法。\n二、工資之標準、計算方法及發放日期。\n三、延長工作時間。\n四、津貼及獎金。\n五、應遵守之紀律。\n六、考勤、請假、獎懲及升遷。\n七、受僱、解僱、資遣、離職及退休。\n八、災害傷病補償及撫卹。\n九、福利措施。\n十、勞雇雙方應遵守勞工安全衛生規定。\n十一、勞雇雙方溝通意見加強合作之方法。\n十二、其他。", "第 71 條": "工作規則，違反法令之強制或禁止規定或其他有關該事業適用之團體協約規定者，無效。"}}], "text": {"第 30 條": "勞工正常工作時間，每日不得超過八小時，每週不得超過四十小時。\n前項正常工作時間，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將其二週內二日之正常工作時數，分配於其他工作日。其分配於其他工作日之時數，每日不得超過二小時。但每週工作總時數不得超過四十八小時。\n第一項正常工作時間，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將八週內之正常工作時數加以分配。但每日正常工作時間不得超過八小時，每週工作總時數不得超過四十八小時。\n前二項規定，僅適用於經中央主管機關指定之行業。\n雇主應置備勞工出勤紀錄，並保存五年。\n前項出勤紀錄，應逐日記載勞工出勤情形至分鐘為止。勞工向雇主申請其出勤紀錄副本或影本時，雇主不得拒絕。\n雇主不得以第一項正常工作時間之修正，作為減少勞工工資之事由。\n第一項至第三項及第三十條之一之正常工作時間，雇主得視勞工照顧家庭成員需要，允許勞工於不變更每日正常工作時數下，在一小時範圍內，彈性調整工作開始及終止之時間。", "第 30 條之 1": "中央主管機關指定之行業，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，其工作時間得依下列原則變更：\n一、四週內正常工作時數分配於其他工作日之時數，每日不得超過二小時，不受前條第二項至第四項規定之限制。\n二、當日正常工作時間達十小時者，其延長之工作時間不得超過二小時。\n三、女性勞工，除妊娠或哺乳期間者外，於夜間工作，不受第四十九條第一項之限制。但雇主應提供必要之安全衛生設施。\n依中華民國八十五年十二月二十七日修正施行前第三條規定適用本法之行業，除第一項第一款之農、林、漁、牧業外，均不適用前項規定。", "第 36 條": "勞工每七日中應有二日之休息，其中一日為例假，一日為休息日。\n雇主有下列情形之一，不受前項規定之限制：\n一、依第三十條第二項規定變更正常工作時間者，勞工每七日中至少應有一日之例假，每二週內之例假及休息日至少應有四日。\n二、依第三十條第三項規定變更正常工作時間者，勞工每七日中至少應有一日之例假，每八週內之例假及休息日至少應有十六日。\n三、依第三十條之一規定變更正常工作時間者，勞工每二週內至少應有二日之例假，每四週內之例假及休息日至少應有八日。\n雇主使勞工於休息日工作之時間，計入第三十二條第二項所定延長工作時間總數。但因天災、事變或突發事件，雇主有使勞工於休息日工作之必要者，其工作時數不受第三十二條第二項規定之限制。\n經中央目的事業主管機關同意，且經中央主管機關指定之行業，雇主得將第一項、第二項第一款及第二款所定之例假，於每七日之週期內調整之。\n前項所定例假之調整，應經工會同意，如事業單位無工會者，經勞資會議同意後，始得為之。雇主僱用勞工人數在三十人以上者，應報當地主管機關備查。", "第 32 條之 1": "雇主依第三十二條第一項及第二項規定使勞工延長工作時間，或使勞工於第三十六條所定休息日工作後，依勞工意願選擇補休並經雇主同意者，應依勞工工作之時數計算補休時數。\n前項之補休，其補休期限由勞雇雙方協商；補休期限屆期或契約終止未補休之時數，應依延長工作時間或休息日工作當日之工資計算標準發給工資；未發給工資者，依違反第二十四條規定論處。", "第 39 條": "第三十六條所定之例假、休息日、第三十七條所定之休假及第三十八條所定之特別休假，工資應由雇主照給。雇主經徵得勞工同意於休假日工作者，工資應加倍發給。因季節性關係有趕工必要，經勞工或工會同意照常工作者，亦同。", "第 40 條": "因天災、事變或突發事件，雇主認有繼續工作之必要時，得停止第三十六條至第三十八條所定勞工之假期。但停止假期之工資，應加倍發給，並應於事後補假休息。\n前項停止勞工假期，應於事後二十四小時內，詳述理由，報請當地主管機關核備。", "第 49 條": "雇主不得使女工於午後十時至翌晨六時之時間內工作。但雇主經工會同意，如事業單位無工會者，經勞資會議同意後，且符合下列各款規定者，不在此限：\n一、提供必要之安全衛生設施。\n二、無大眾運輸工具可資運用時，提供交通工具或安排女工宿舍。\n前項第一款所稱必要之安全衛生設施，其標準由中央主管機關定之。但雇主與勞工約定之安全衛生設施優於本法者，從其約定。\n女工因健康或其他正當理由，不能於午後十時至翌晨六時之時間內工作者，雇主不得強制其工作。\n第一項規定，於因天災、事變或突發事件，雇主必須使女工於午後十時至翌晨六時之時間內工作時，不適用之。\n第一項但書及前項規定，於妊娠或哺乳期間之女工，不適用之。", "第 50 條": "女工分娩前後，應停止工作，給予產假八星期；妊娠三個月以上流產者，應停止工作，給予產假四星期。\n前項女工受僱工作在六個月以上者，停止工作期間工資照給；未滿六個月者減半發給。", "第 51 條": "女工在妊娠期間，如有較為輕易之工作，得申請改調，雇主不得拒絕，並不得減少其工資。", "第 52 條": "子女未滿一歲須女工親自哺乳者，於第三十五條規定之休息時間外，雇主應每日另給哺乳時間二次，每次以三十分鐘為度。\n前項哺乳時間，視為工作時間。", "第 70 條": "雇主僱用勞工人數在三十人以上者，應依其事業性質，就左列事項訂立工作規則，報請主管機關核備後並公開揭示之：\n一、工作時間、休息、休假、國定紀念日、特別休假及繼續性工作之輪班方法。\n二、工資之標準、計算方法及發放日期。\n三、延長工作時間。\n四、津貼及獎金。\n五、應遵守之紀律。\n六、考勤、請假、獎懲及升遷。\n七、受僱、解僱、資遣、離職及退休。\n八、災害傷病補償及撫卹。\n九、福利措施。\n十、勞雇雙方應遵守勞工安全衛生規定。\n十一、勞雇雙方溝通意見加強合作之方法。\n十二、其他。", "第 71 條": "工作規則，違反法令之強制或禁止規定或其他有關該事業適用之團體協約規定者，無效。"}}, "basicLaws": [{"t": "工時與加班", "i": ["每日正常工時不超過 8 小時，每週不超過 40 小時。", "連續工作 4 小時，至少休息 30 分鐘。", "延長工時每月上限 46 小時；經工會或勞資會議同意，每月最多 54 小時、每三個月最多 138 小時。", "加班費：前 2 小時至少加給 1/3，再延長 2 小時至少加給 2/3。"]}, {"t": "特別休假", "i": ["6 個月以上未滿 1 年：3 日", "1 年以上未滿 2 年：7 日", "2 年以上未滿 3 年：10 日", "3 年以上未滿 5 年：每年 14 日", "5 年以上未滿 10 年：每年 15 日", "10 年以上：每年加 1 日，最多 30 日"]}, {"t": "輪班與休假", "i": ["換班間隔原則上至少連續 11 小時；經公告的特殊情形不少於 8 小時。" function week(W){ return DATA.weeks[W-1]; }
function lesson(W,L,r=st.role){ const w=week(W); if(!w) return null; return L<3?w.lessons[r][L]:L===3?w.common:w.case; }
function lid(W,L,r=st.role){ return L===3?`T-${W}`:L===4?`C-${W}`:`${r}-${W}-${L}`; }
function parseKey(k){ let m=k.match(/^([TC])-(\d+)$/); if(m) return {role:null,W:+m[2],L:m[1]==="T"?3:4}; m=k.match(/^(\w+)-(\d+)-(\d)$/); return m?{role:m[1],W:+m[2],L:+m[3]}:null; }
function weekDone(W,r=st.role){ let n=0; for(let L=0;L<5;L++) if(st.done[lid(W,L,r)]) n++; return n; }
function nextAfter(){ for(let W=1;W<=WEEKS;W++) for(let L=0;L<5;L++) if(!st.done[lid(W,L)]) return {W,L}; return null; }
function seqNext(){ let W=st.W, L=st.L+1; if(L>4){ W++; L=0; } return week(W)?{W,L}:null; }
function touchDay(){ if(!st.days.includes(todayStr)){ st.days.push(todayStr); store.set("days",st.days); } }
function saveLast(){ store.set("last",{role:st.role,W:st.W,L:st.L,S:st.S}); }
function sugDate(W){ if(!st.start) return ""; const t=new Date(st.start+"T00:00:00"); t.setDate(t.getDate()+7*(W-1)); return `${t.getMonth()+1}/${t.getDate()}`; }
function curWeekBySchedule(){ if(!st.start) return 1; const d=Math.floor((new Date(todayStr)-new Date(st.start))/86400000); return Math.max(1,Math.min(WEEKS,Math.floor(d/7)+1)); }
function allQuizBlocks(W,r=st.role){ const out=[]; for(let L=0;L<4;L++){ const l=lesson(W,L,r); (l.slides||[]).flat().forEach(b=>{ if(b.k==="quiz"||b.k==="order") out.push(b); }); } return out; }
function findBlock(key){ for(const w of DATA.weeks){ for(const r of ORDER) for(const l of w.lessons[r]) for(const b of l.slides.flat()) if(b.key===key) return b; for(const b of w.common.slides.flat()) if(b.key===key) return b; } return null; }
function weekTier(W,r=st.role){
  if(!week(W)||weekDone(W,r)<5) return null;
  let total=0,ans=0,wrong=0;
  allQuizBlocks(W,r).forEach(b=>{ total++;
    if(b.k==="quiz"){ if(st.first[b.key]!==undefined){ ans++; if(st.first[b.key]!==b.a) wrong++; } }
    else { const p=st.ordFirst[b.key]||[]; if(p.length===b.i.length){ ans++; if(p.some((v,i)=>v!==i)) wrong++; } } });
  if(ans<total) return "bronze"; return wrong?"silver":"gold";
}
function endTier(e){ return {E1:"gold",E2:"silver",E3:"bronze"}[e]||null; }
function caseTier(W){ const e=st.ends[W]||[]; return e.includes("E1")?"gold":e.includes("E2")?"silver":e.includes("E3")?"bronze":null; }
function medalCount(){ let n=0; for(let W=1;W<=WEEKS;W++){ if(weekTier(W)) n++; if(caseTier(W)) n++; } return n; }

const GT=Object.keys(DATA.gloss).sort((a,b)=>b.length-a.length);
function gl(text,S){ const src=String(text), picks=[];
  for(const t of GT){ if(S.has(t)) continue; let from=0, i;
    while((i=src.indexOf(t,from))>=0){ if(!picks.some(p=>i<p[1]&&i+t.length>p[0])){ picks.push([i,i+t.length,t]); S.add(t); break; } from=i+1; } }
  picks.sort((x,y)=>x[0]-y[0]); let out="", pos=0;
  for(const [a,b,t] of picks){ out+=esc(src.slice(pos,a))+`<button type="button" class="term" data-term="${esc(t)}">${esc(t)}</button>`; pos=b; }
  return out+esc(src.slice(pos)); }

/* ================= 卡片 ================= */
function choice(b,S){
  const sel=st.first[b.key], isPred=b.k==="pred";
  const opts=b.o.map((t,i)=>{ let c=""; if(sel!==undefined){ if(i===b.a) c="right"; else if(i===sel) c="wrong"; else c="dim"; }
    return `<button type="button" class="opt ${c}" data-ans="${b.key}" data-i="${i}" ${sel!==undefined?"disabled":""}><b>${"ABC"[i]}</b><span>${esc(t)}</span></button>`; }).join("");
  let fb="";
  if(sel!==undefined){
    const ok=sel===b.a;
    fb=`<div class="why ${ok?"good":isPred?"info":"bad"}"><span class="lbl">${ok?"答對了":isPred?"答案是 "+"ABC"[b.a]:"正確答案是 "+"ABC"[b.a]}</span><span>${gl(b.y,S)}</span></div>`;
    if(!ok && !isPred){
      const r=st.retry[b.key];
      if(r===b.a) fb+=`<div class="why good"><span class="lbl">重練答對了</span><span>這題的獎章等級仍以第一次作答計算。</span></div>`;
      else if(st.retryOpen[b.key]) fb+=`<div class="opts">${b.o.map((t,i)=>`<button type="button" class="opt ${r===i?"wrong":""}" data-retry="${b.key}" data-i="${i}"><b>${"ABC"[i]}</b><span>${esc(t)}</span></button>`).join("")}</div><p class="small">${r!==undefined?"還不對，再想一下解析的第一步。":"想一次再選，這次不計入獎章。"}</p>`;
      else fb+=`<div class="btns"><button type="button" class="btn ghost" data-act="retry" data-key="${b.key}">重練這題</button><span class="small">獎章仍看第一次作答</span></div>`;
    }
  } else fb=`<p class="small">${isPred?"先猜猜看，再看答案。":"選一個答案，馬上看解析。"}</p>`;
  return `<div style="display:grid;gap:10px">${isPred?`<span class="tag">先猜猜看</span>`:`<span class="tag two">${b.two?"兩步推理題":"判斷題"}</span>`}<h3>${gl(b.q,S)}</h3><div class="opts">${opts}</div>${fb}</div>`;
}
function orderHTML(b){
  const p=st.ord[b.key]||[], full=p.length===b.i.length, ok=full&&p.every((v,i)=>v===i);
  const idx=b.i.map((_,i)=>i).sort((x,y)=>((x*7+3)%b.i.length)-((y*7+3)%b.i.length));
  const btns=idx.map(i=>{ const pos=p.indexOf(i); return `<button type="button" class="${pos>=0?"on":""}" data-ord="${b.key}" data-i="${i}" ${pos>=0||full?"disabled":""}><i>${pos>=0?pos+1:""}</i><span>${esc(b.i[i])}</span></button>`; }).join("");
  const fb= full ? `<div class="why ${ok?"good":"bad"}"><span class="lbl">${ok?"順序正確":"順序不對"}</span><span>${esc(b.y)}</span></div>${ok?"":`<div class="btns"><button type="button" class="btn ghost" data-act="ordreset" data-key="${b.key}">重排一次</button><span class="small">獎章仍看第一次排序</span></div>`}` : `<p class="small">依序點選，排好會自動對答案。</p>`;
  return `<div style="display:grid;gap:10px"><span class="tag two">排序題</span><h3>${esc(b.t)}</h3><div class="ord">${btns}</div>${fb}</div>`;

function block(b,S){

  switch(b.k){
    case "head": return `<div class="eyebrow">${st.L===3?`第 ${st.W} 週 · 共同課 · 三個職務共讀`:`第 ${st.W} 週 · ${ROLES[st.role]} · ${STEPN[st.L]}`}</div><h2>${esc(b.t)}</h2><div class="goal"><b>讀完你能</b><span>${gl(b.g,S)}</span></div>`;

    case "pred": case "quiz": return choice(b,S);

(function(){

  return poly([P(x,y+dy,z0),P(x+dx,y+dy,z0),P(x+dx,y+dy,z0+h),P(x,y+dy,z0+h)],o.left??c)
       + poly([P(x+dx,y,z0),P(x+dx,y+dy,z0),P(x+dx,y+dy,z0+h),P(x+dx,y,z0+h)],o.right??mix(c,-18))
       + poly([P(x,y,z0+h),P(x+dx,y,z0+h),P(x+dx,y+dy,z0+h),P(x,y+dy,z0+h)],o.top??mix(c,14)); }

function flagSet(spec,parts){ const k=K(), st=spec.fl||0, p0=parts.find(p=>!p.z0&&!p.round)||parts[0];
  const pole=(a,b,c,H,i)=>{ const q=P(a,b); return `<g transform="translate(${f1(q[0])},${f1(q[1])}) scale(${k.toFixed(3)})"><rect x="-3" y="-2" width="6" height="3" fill="#B9C0C7"/><path d="M0 0 V-${H}" stroke="#9AA6B1" stroke-width="2.2"/><circle cy="-${H+1}" r="2.2" fill="#D9B24A"/><g class="is-sway" style="animation-delay:-${i*.7}s"><path d="M0 -${H-1} h${H>55?18:15} l-3 4.5 l3 4.5 h-${H>55?18:15} z" fill="${c}" stroke="rgba(0,0,0,.15)" stroke-width=".6"/></g></g>`; };
  if(st===0) return [[.3,.99,"#FFFFFF"],[.4,.99,TR()],[.5,.99,"#F0C33C"]].map(([a,b,c],i)=>pole(a,b,c,50,i)).join("");
  if(st===1) return pole(.97,.97,TR(),60,0)+box(.94,.94,.06,.06,.03,"#B9C0C7");
  if(st===2){ const y=p0.y+p0.dy+.003, z1=.06+(p0.h-.04)*.92, z0=z1-Math.min(.2,p0.h*.5); return [TR(),"#F0C33C",TR()].map((c,i)=>{ const a=p0.x+p0.dx*(.3+i*.22); return fL(a,a+.035,y,z0,z1,c)+fL(a,a+.035,y,z0-.015,z0,mix(c,-20)); }).join(""); }
  if(st===3){ const y=p0.y+p0.dy+.15; return pole(p0.x+p0.dx*.02,y,TR(),42,0)+pole(p0.x+p0.dx*.3,y,"#F0C33C",42,1); }

  return `<button type="button" class="is-areacard" data-isle="openarea" aria-label="看整座園區">${areaSVG()}<span><b>${RN[role()]} · ${n} / ${total} 關</b><span>已完工 ${built} / 16 棟 · 全對 ${gold} · 證書 ${certs()} / 3 · 實踐牌 ${Object.keys(getR("islePlaq",{})).length} · 樹 ${trees()} 棵</span></span></button>`; };
/* 重玩案例拿到更好的結局：打開工地播翻修動畫；第一次全對再加煙火 */
window.isleCaseEnd=function(W,prev,now){ if(!prev||stageOf(W)<5) return; if(ER.indexOf(now)>=ER.indexOf(prev)) return;
  renovNext={W,from:prev}; if(partyFor(W)) partyNext=true; openIsle("site"); };
function isleSig(){ if(!st.role) return ""; const W=curWeek(), ev=evState(), ins=inspState(), au=audState();
  return [role(),W,stageOf(W),endOf(W)||"",ev&&!ev.done?ev.w+"-"+ev.r:"",ins&&!ins.done?ins.key:"",au&&!au.done?au.m:""].join("|"); }
function markSeen(){ try{ const a=byRole("isleSig"); a[role()]=isleSig(); store.set("isleSig",a); }catch(e){} }
window.isleBoot=function(){ if(!st.role) return; ensureHost(); const ap=document.getElementById("achpop"); if(ap&&!ap.hidden&&ap.offsetParent!==null){ setTimeout(isleBoot,800); return; } const a=byRole("isleSig"); if(a[role()]!==isleSig()) openIsle("site"); };
window.isleBackup=function(){ const o={}; ["isleTrees","islePlaq","isleAud","isleParty","isleMile"].forEach(k=>o[k]=store.get(k,null)); return o; };
window.isleRestore=function(o){ if(!o) return; ["isleTrees","islePlaq","isleAud","isleParty","isleMile"].forEach(k=>{ if(o[k]&&!store.get(k,null)) store.set(k,o[k]); }); };

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-isle]"); if(!a) return; const act=a.dataset.isle;
  if(act==="open"){ openIsle("site"); return; }
  if(act==="openarea"){ openIsle("area"); return; }
  if(act==="close"){ closeIsle(); render(); return; }
  if(act==="mile"){ mileOpen(+a.dataset.b); return; }
  if(act==="mileok"){ mileClose(); return; }
  if(act==="vsite"||act==="varea"){ view=act==="vsite"?"site":"area"; refresh(); return; }
  if(act==="start"){ closeIsle(); const n=nextAfter(); if(n) goL(n.W,n.L); else { st.tab="today"; render(); } return; }
  if(act==="plaque"){ const w=+a.dataset.w, p=getR("islePlaq",{}); if(p[w]) delete p[w]; else p[w]=todayStr; setR("islePlaq",p); refresh(); return; }
  if(act==="qclose"){ qClose(); return; }
  if(act==="insp"){ const s=inspState(); if(!s||s.done) return; qCur={kind:"insp",s}; ensureHost(); qOpen(askHTML("insp",s)); return; }
  if(act==="ev"){ const s=evState(); if(!s||s.done) return; qCur={kind:"ev",s}; ensureHost(); qOpen(askHTML("ev",s)); return; }
  if(act==="aud"){ const s=audState(); if(!s||s.done) return; qCur={kind:"aud",s}; ensureHost(); qOpen(askHTML("aud",s)); return; }
  if(act==="ans"&&qCur){ const {kind,s}=qCur, key=kind==="insp"?s.key:s.keys[s.r], b=findQ(key).b, i=+a.dataset.i, ok=i===b.a;
    document.querySelectorAll("#is-opts button").forEach(x=>{ x.disabled=true; if(+x.dataset.i===b.a&&(ok||kind==="insp")) x.classList.add("ok"); }); if(!ok) a.classList.add("no");
    let msg, next, label, exp=b.y||"";
    if(kind==="insp"){ s.done=true; setR("isleInsp",s); if(ok) setR("isleTrees",trees()+1); msg=ok?"答對了！園區多種了一棵樹。":"這次沒答對，看完解析，稽查員下週還會再來。"; next="qdone"; label=qOut?"回到課程":"回到工地"; }
    else if(!ok){ exp=""; msg=kind==="ev"?"這樣不對，想想這週學過的重點，再選一次。":"稽核員記下一筆，再想想看。"; next="qretry"; label="再試一次"; }
    else if(s.r===0){ msg=kind==="ev"?"答對了，一樓恢復供電。":"第一回合通過。"; next="qround"; label="下一回合"; }
    else { s.done=true; msg=kind==="ev"?"兩回合都答對，全棟恢復供電！":`稽核通過，拿到第 ${s.m} 週的證書！`; next="qdone"; label=qOut?"回到課程":"回到工地"; }
    if(kind==="ev") setR("isleEv",s); if(kind==="aud") saveAud(s);
    if(ok){ const sc=document.getElementById("is-scene"); if(sc) sc.innerHTML=kind==="aud"&&s.done?certSVG(s.m):sceneOf(kind,s,true); }
    document.getElementById("is-fb").innerHTML=`<div class="is-fbx ${ok?"is-late":""}"><b>${msg}</b>${esc(exp)}</div><button type="button" class="is-btn primary ${ok?"is-late":""}" data-isle="${next}">${label}</button>`;
    return; }
  if(act==="qretry"&&qCur){ qOpen(askHTML(qCur.kind,qCur.s)); return; }
  if(act==="qround"&&qCur){ qCur.s.r=1; if(qCur.kind==="ev") setR("isleEv",qCur.s); else saveAud(qCur.s); qOpen(askHTML(qCur.kind,qCur.s)); return; }
  if(act==="qdone"){ markSeen(); qClose(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const ml=document.getElementById("isle-mile"); if(ml&&!ml.hidden){ mileClose(); return; } if(qMode) qClose(); else if(openNow){ closeIsle(); render(); } } });
window.__advIsleTest={mileOpen,mileRowSVG,siteSVG,areaSVG,evState,inspState,audState,openIsle,curWeek};

})();
render();isleBoot();

</script>
